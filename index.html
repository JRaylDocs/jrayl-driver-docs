<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JRayl Driver Support Documents</title>

  <link rel="stylesheet" href="style.css" />

  <style>
    main { padding: 16px; }

    .docs-section {
      max-width: 960px;
      margin: 0 auto;
    }

    .site-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .site-logo {
      max-width: 180px;
      width: 100%;
      height: auto;
      margin: 0 auto 12px;
      display: block;
    }

    .group-title {
      margin-top: 28px;
      margin-bottom: 6px;
    }

    .group-subtitle {
      margin-top: -2px;
      margin-bottom: 12px;
      font-size: 0.95rem;
      opacity: 0.8;
    }

    .cards-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    @media (min-width: 720px) {
      .cards-grid { grid-template-columns: 1fr 1fr; }
    }

    .doc-card {
      padding: 14px;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .doc-card h3 {
      margin: 0;
      font-size: 1.05rem;
      line-height: 1.25;
    }

    .doc-btn {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      padding: 14px 16px;
      border-radius: 12px;
      font-weight: 600;
      text-decoration: none;
    }

    /* Accordion headers */
    .accordion-header {
      cursor: pointer;
      user-select: none;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 28px;
      margin-bottom: 8px;
    }

    .accordion-header .chev {
      margin-left: auto;
      font-weight: 700;
    }

    .hidden { display: none; }
  </style>
</head>

<body>

  <header class="site-header">
    <img src="jrayl-logo.png" alt="JRayl Transport Logo" class="site-logo" />
    <h1>Driver Support Documents</h1>
    <p>Your quick-access resource hub</p>
  </header>

  <main>
    <section class="docs-section">

      <!-- PINNED DRIVER REFERENCE (always visible) -->
      <h2>Driver Reference</h2>
      <p class="group-subtitle">Quick access (pinned)</p>
      <div id="pinnedList" class="cards-grid"></div>

      <!-- ACCORDION SECTIONS -->
      <h2 class="accordion-header" onclick="toggleAccordion('employee')">
        JRayl Employee Docs <span id="chev-employee" class="chev">▶</span>
      </h2>
      <div id="panel-employee" class="cards-grid hidden"></div>

      <h2 class="accordion-header" onclick="toggleAccordion('dot')">
        DOT Compliance <span id="chev-dot" class="chev">▶</span>
      </h2>
      <div id="panel-dot" class="cards-grid hidden"></div>

      <h2 class="accordion-header" onclick="toggleAccordion('maintenance')">
        Trailer Registration <span id="chev-maintenance" class="chev">▶</span>
      </h2>
      <div id="panel-maintenance" class="cards-grid hidden"></div>

      <h2 class="accordion-header" onclick="toggleAccordion('other')">
        JRayl People Portal <span id="chev-other" class="chev">▶</span>
      </h2>
      <div id="panel-other" class="cards-grid hidden"></div>

    </section>
  </main>

  <footer>
    <p>© JRayl Transport – Driver Resource Portal</p>
  </footer>

  <script>
    const panels = ["employee", "dot", "maintenance", "other"];

    function createCard(doc) {
      const card = document.createElement("div");
      card.className = "doc-card";

      const title = document.createElement("h3");
      title.textContent = doc.title;

      const btn = document.createElement("a");
      btn.className = "doc-btn";
      btn.href = doc.href;
      btn.target = "_blank";
      btn.rel = "noopener";
      btn.textContent = doc.type === "pdf" ? "Open PDF" : "Open Document";

      card.appendChild(title);
      card.appendChild(btn);
      return card;
    }

    function renderList(containerId, docs) {
      const container = document.getElementById(containerId);
      container.innerHTML = "";
      docs.forEach(doc => container.appendChild(createCard(doc)));
    }

    function closeAllExcept(openKey) {
      panels.forEach(key => {
        const panel = document.getElementById("panel-" + key);
        const chev = document.getElementById("chev-" + key);
        if (!panel || !chev) return;

        if (key !== openKey) {
          panel.classList.add("hidden");
          chev.textContent = "▶";
        }
      });
    }

    function toggleAccordion(key) {
      const panel = document.getElementById("panel-" + key);
      const chev = document.getElementById("chev-" + key);
      if (!panel || !chev) return;

      const isClosed = panel.classList.contains("hidden");

      // Ensure only one open at a time
      closeAllExcept(key);

      if (isClosed) {
        panel.classList.remove("hidden");
        chev.textContent = "▼";
      } else {
        panel.classList.add("hidden");
        chev.textContent = "▶";
      }
    }

    async function loadDocs() {
      try {
        const res = await fetch("docs-manifest.json", { cache: "no-store" });
        const docs = await res.json();

        // Pinned always visible
        renderList("pinnedList", docs.filter(d => d.pinned));

        // Accordion panels
        renderList("panel-employee", docs.filter(d => d.group === "employee"));
        renderList("panel-dot", docs.filter(d => d.group === "dot"));
        renderList("panel-maintenance", docs.filter(d => d.group === "maintenance"));
        renderList("panel-other", docs.filter(d => d.group === "other"));

        // Optional: auto-open the first non-empty panel
        // (uncomment if you want one panel open by default)
        /*
        const firstNonEmpty = [
          ["employee", docs.some(d => d.group === "employee")],
          ["dot", docs.some(d => d.group === "dot")],
          ["maintenance", docs.some(d => d.group === "maintenance")],
          ["other", docs.some(d => d.group === "other")]
        ].find(x => x[1]);
        if (firstNonEmpty) toggleAccordion(firstNonEmpty[0]);
        */
      } catch (err) {
        console.error(err);
        document.getElementById("panel-other").innerHTML =
          "<p>Unable to load documents.</p>";
      }
    }

    loadDocs();
  </script>

</body>
</html>
