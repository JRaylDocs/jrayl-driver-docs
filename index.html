  <div id="pdfModal" role="dialog" aria-modal="true" aria-label="Document viewer">
    <div class="modal-toolbar">
      <span class="modal-title" id="modalTitle"></span>
      <a id="modalDownload" href="#" download>⬇ Download</a>
      <button class="modal-close" onclick="closeModal()">✕ Close</button>
    </div>

    <!-- PDF.js renders here — one canvas per page -->
    <div id="pdfViewer" style="
      flex: 1;
      overflow-y: auto;
      background: #525659;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px 0;
      gap: 10px;
    ">
      <p id="pdfLoading" style="color:#fff;margin-top:40px;font-size:1rem;">
        Loading document…
      </p>
    </div>
  </div>


<!-- ============================================================
     CHANGE 2 OF 2 — Replace your entire <script> block
     Find the opening <script> tag near the bottom of index.html
     and replace everything from <script> to </script> with this.
     ============================================================ -->

  <!-- PDF.js library loaded from CDN (same-origin fallback built in) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <script>
    // ─── Config ───────────────────────────────────────────────────────────────
    const NEW_BADGE_DAYS = 7;
    const ANALYTICS_URL  = "https://script.google.com/macros/s/AKfycbzZfL1YUQQAD1YrpIAYStoEUNNyDOfAusULO2yJyPElDS8mdBlaHwvMDBUzdf7-Fy3e/exec";
    const SW_CACHE_NAME  = "jrayl-v1";

    // ─── PDF.js worker ────────────────────────────────────────────────────────
    // Points to the matching worker on the same CDN
    if (window.pdfjsLib) {
      pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
    }

    // ─── Analytics ────────────────────────────────────────────────────────────
    function trackOpen(title, group, href) {
      if (!ANALYTICS_URL || ANALYTICS_URL === "YOUR_APPS_SCRIPT_URL_HERE") return;
      if (!navigator.onLine) return;
      const ua = navigator.userAgent.toLowerCase();
      let device = "Desktop";
      if (ua.includes("tablet") || ua.includes("ipad"))         device = "Tablet";
      else if (ua.includes("mobile") || ua.includes("android")) device = "Mobile";
      const params = new URLSearchParams({ title, group, href, device, timestamp: new Date().toISOString() });
      const img = new Image();
      img.src = `${ANALYTICS_URL}?${params.toString()}`;
    }

    // ─── Offline banner ───────────────────────────────────────────────────────
    function updateOnlineBanner() {
      document.getElementById("offlineBanner").style.display =
        navigator.onLine ? "none" : "block";
    }
    window.addEventListener("online",  updateOnlineBanner);
    window.addEventListener("offline", updateOnlineBanner);
    updateOnlineBanner();

    // ─── PWA Service Worker ───────────────────────────────────────────────────
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js").catch(err =>
        console.warn("SW registration failed:", err)
      );
    }

    // ─── PDF Modal ────────────────────────────────────────────────────────────
    function openModal(href, title, group) {
      trackOpen(title, group, href);

      document.getElementById("modalTitle").textContent = title;
      document.getElementById("modalDownload").href     = href;
      document.getElementById("modalDownload").download = href.split("/").pop();
      document.getElementById("pdfModal").classList.add("open");
      document.body.style.overflow = "hidden";

      const viewer  = document.getElementById("pdfViewer");
      const loading = document.getElementById("pdfLoading");
      viewer.innerHTML = "";
      viewer.appendChild(loading);
      loading.textContent = "Loading document…";
      loading.style.display = "block";

      // PDF.js fetches the file from the same Netlify domain — always allowed
      pdfjsLib.getDocument(href).promise
        .then(pdf => {
          loading.style.display = "none";
          const renders = [];
          for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
            renders.push(renderPage(pdf, pageNum, viewer));
          }
          return Promise.all(renders);
        })
        .catch(err => {
          console.error("PDF.js error:", err);
          loading.textContent = "⚠️ Could not load document. Try the Download button above.";
        });
    }

    function renderPage(pdf, pageNum, container) {
      return pdf.getPage(pageNum).then(page => {
        // Scale to fit the viewer width on any screen size
        const viewerWidth = container.clientWidth || window.innerWidth;
        const desiredWidth = Math.min(viewerWidth - 24, 960);
        const viewport     = page.getViewport({ scale: 1 });
        const scale        = desiredWidth / viewport.width;
        const scaled       = page.getViewport({ scale });

        const canvas    = document.createElement("canvas");
        canvas.width    = scaled.width;
        canvas.height   = scaled.height;
        canvas.style.cssText = "display:block;box-shadow:0 2px 12px rgba(0,0,0,0.4);border-radius:4px;max-width:100%;";

        container.appendChild(canvas);

        return page.render({
          canvasContext: canvas.getContext("2d"),
          viewport: scaled,
        }).promise;
      });
    }

    function closeModal() {
      document.getElementById("pdfModal").classList.remove("open");
      document.getElementById("pdfViewer").innerHTML = "";
      document.body.style.overflow = "";
    }

    document.getElementById("pdfModal").addEventListener("click", e => {
      if (e.target === e.currentTarget) closeModal();
    });

    document.addEventListener("keydown", e => {
      if (e.key === "Escape") closeModal();
    });

    // ─── Accordion ────────────────────────────────────────────────────────────
    const panels = ["programs", "reference", "updates", "employee", "dot", "other"];

    function closeAllExcept(openKey) {
      panels.forEach(key => {
        if (key === "dot") {
          const p = document.getElementById("panel-dot");
          const c = document.getElementById("chev-dot");
          if (key !== openKey) { p.classList.add("hidden"); c.textContent = "▶"; closeNestedTrailer(); }
          return;
        }
        const p = document.getElementById("panel-" + key);
        const c = document.getElementById("chev-" + key);
        if (key !== openKey) { p.classList.add("hidden"); c.textContent = "▶"; }
      });
    }

    function toggleAccordion(key) {
      if (key === "dot") {
        const p = document.getElementById("panel-dot");
        const c = document.getElementById("chev-dot");
        const closed = p.classList.contains("hidden");
        closeAllExcept("dot");
        if (closed) { p.classList.remove("hidden"); c.textContent = "▼"; }
        else { p.classList.add("hidden"); c.textContent = "▶"; closeNestedTrailer(); }
        return;
      }
      const p = document.getElementById("panel-" + key);
      const c = document.getElementById("chev-" + key);
      const closed = p.classList.contains("hidden");
      closeAllExcept(key);
      if (closed) { p.classList.remove("hidden"); c.textContent = "▼"; }
      else { p.classList.add("hidden"); c.textContent = "▶"; }
    }

    function closeNestedTrailer() {
      const p = document.getElementById("panel-trailer");
      const c = document.getElementById("chev-trailer");
      if (p) p.classList.add("hidden");
      if (c) c.textContent = "▶";
    }

    function toggleNested(which) {
      if (which !== "trailer") return;
      const p = document.getElementById("panel-trailer");
      const c = document.getElementById("chev-trailer");
      const closed = p.classList.contains("hidden");
      if (closed) { p.classList.remove("hidden"); c.textContent = "▼"; }
      else { p.classList.add("hidden"); c.textContent = "▶"; }
    }

    // ─── Card builder ─────────────────────────────────────────────────────────
    function isNew(dateAdded) {
      if (!dateAdded) return false;
      const diffDays = (new Date() - new Date(dateAdded)) / (1000 * 60 * 60 * 24);
      return diffDays <= NEW_BADGE_DAYS;
    }

    function formatDate(isoString) {
      if (!isoString) return null;
      const d = new Date(isoString);
      const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
      const date   = `${months[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;
      const hours  = d.getHours();
      const mins   = String(d.getMinutes()).padStart(2, "0");
      const ampm   = hours >= 12 ? "PM" : "AM";
      const h12    = hours % 12 || 12;
      return `${date} ${h12}:${mins} ${ampm}`;
    }

    function createCard(doc) {
      const card = document.createElement("div");
      card.className = "doc-card";

      if (isNew(doc.dateAdded)) {
        const badge = document.createElement("span");
        badge.className   = "badge-new";
        badge.textContent = "New";
        card.appendChild(badge);
      }

      const title = document.createElement("h3");
      title.textContent = doc.title;
      card.appendChild(title);

      if (doc.dateModified) {
        const meta = document.createElement("p");
        meta.className   = "doc-meta";
        meta.textContent = `Updated ${formatDate(doc.dateModified)}`;
        card.appendChild(meta);
      }

      const actions = document.createElement("div");
      actions.className = "card-actions";

      const viewBtn = document.createElement("button");
      viewBtn.className   = "doc-btn btn-view";
      viewBtn.textContent = doc.type === "pdf" ? "View PDF" : "View Document";
      viewBtn.addEventListener("click", () => openModal(doc.href, doc.title, doc.group));

      const dlBtn = document.createElement("a");
      dlBtn.className   = "doc-btn btn-download";
      dlBtn.href        = doc.href;
      dlBtn.download    = doc.href.split("/").pop();
      dlBtn.title       = "Download";
      dlBtn.textContent = "⬇";

      actions.appendChild(viewBtn);
      actions.appendChild(dlBtn);
      card.appendChild(actions);

      return card;
    }

    function renderList(containerId, docs) {
      const container = document.getElementById(containerId);
      if (!container) return;
      container.innerHTML = "";
      docs.forEach(doc => container.appendChild(createCard(doc)));
    }

    // ─── Shared error renderer ────────────────────────────────────────────────
    function showLoadError() {
      const errorMsg = "<p style='color:red;padding:8px'>⚠️ Could not load documents. Check your connection.</p>";
      document.querySelectorAll(".cards-grid").forEach(el => {
        el.innerHTML = errorMsg;
        el.classList.remove("hidden");
      });
    }

    // ─── Load message banner ──────────────────────────────────────────────────
    async function loadMessage() {
      try {
        const res = await fetch("message.json");
        const msg = await res.json();
        const el  = document.getElementById("siteMessage");
        if (!el) return;
        if (!msg.active) { el.style.display = "none"; return; }
        el.textContent = msg.text;
        const styles = {
          default: { background: "#ffffff", border: "#000000", color: "#000000" },
          urgent:  { background: "#fee2e2", border: "#dc2626", color: "#991b1b" },
          info:    { background: "#eff6ff", border: "#2563eb", color: "#1e40af" },
          success: { background: "#f0fdf4", border: "#16a34a", color: "#15803d" },
        };
        const s = styles[msg.style] || styles.default;
        el.style.background  = s.background;
        el.style.borderColor = s.border;
        el.style.color       = s.color;
        el.style.display     = "inline-block";
      } catch {
        const el = document.getElementById("siteMessage");
        if (el) el.style.display = "none";
      }
    }

    // ─── Load manifest ────────────────────────────────────────────────────────
    async function loadDocs() {
      let docs;
      try {
        const res = await fetch("docs-manifest.json");
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        docs = await res.json();
      } catch (networkErr) {
        console.warn("Network fetch failed, trying SW cache:", networkErr);
        try {
          const cache  = await caches.open(SW_CACHE_NAME);
          const cached = await cache.match("docs-manifest.json");
          if (!cached) throw new Error("Not found in SW cache");
          docs = await cached.json();
        } catch (cacheErr) {
          console.error("SW cache fallback also failed:", cacheErr);
          showLoadError();
          return;
        }
      }
      renderList("panel-programs",  docs.filter(d => d.group === "programs"));
      renderList("panel-reference", docs.filter(d => d.group === "reference"));
      renderList("panel-updates",   docs.filter(d => d.group === "updates"));
      renderList("panel-employee",  docs.filter(d => d.group === "employee"));
      renderList("dotDocs",         docs.filter(d => d.group === "dot"));
      renderList("panel-trailer",   docs.filter(d => d.group === "maintenance"));
      renderList("panel-other",     docs.filter(d => d.group === "other"));
    }

    loadDocs();
    loadMessage();
  </script>
