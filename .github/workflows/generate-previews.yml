name: Generate PDF Previews

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

# Only one run at a time — prevents two runs racing to push at once.
# (Note: this does NOT guard against a human pushing mid-run, which is the
#  race that previously broke the rebase. The regenerate-on-latest loop below
#  handles that case.)
concurrency:
  group: generate-previews
  cancel-in-progress: false

jobs:
  build-previews:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pdf-to-img
        run: npm install pdf-to-img@6.1.0

      - name: Generate previews and push (resilient to concurrent pushes)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            # Always (re)generate against the very latest main. Because the
            # previews are fully derived from the PDFs at HEAD, regenerating on
            # top of the newest main can never produce a rename/delete conflict
            # the way `git pull --rebase` did — there is nothing to merge.
            git fetch origin main
            git reset --hard origin/main

            node generate-previews.mjs

            git add -A
            if git diff --staged --quiet; then
              echo "No preview changes to commit."
              exit 0
            fi

            # Do NOT put [skip ci] here — Netlify honors it and would skip the
            # deploy. Commits by GITHUB_TOKEN don't re-trigger this workflow.
            git commit -m "Auto-generate PDF previews"

            if git push origin HEAD:main; then
              echo "Push succeeded on attempt $attempt."
              exit 0
            fi

            echo "Push rejected on attempt $attempt (someone pushed mid-run); regenerating on latest main..."
          done

          echo "Push failed after 5 attempts."
          exit 1
