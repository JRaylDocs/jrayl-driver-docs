name: Generate PDF Previews

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

# Only one run at a time — prevents two runs trying to push at once
concurrency:
  group: generate-previews
  cancel-in-progress: false

jobs:
  build-previews:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pdf-to-img
        run: npm install pdf-to-img@6.1.0

      - name: Generate PNG previews
        run: node generate-previews.mjs

      - name: Commit previews back to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No preview changes to commit."
            exit 0
          fi
          git commit -m "Auto-generate PDF previews [skip ci]"
          # Retry push up to 3 times — if a new commit landed while we were
          # generating previews, pull (rebase) and try again. This prevents
          # the race condition where a user uploads a new PDF while the
          # workflow is running and the push gets rejected.
          for i in 1 2 3; do
            if git push; then
              echo "Push succeeded on attempt $i."
              exit 0
            fi
            echo "Push rejected on attempt $i, pulling latest and retrying..."
            git pull --rebase origin main || exit 1
          done
          echo "Push failed after 3 attempts."
          exit 1
